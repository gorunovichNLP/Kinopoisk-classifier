# Local infrastructure: Kafka, MongoDB, MLflow, PostgreSQL, and MinIO.
#
# Database per Service: MLflow and Prediction Writer use separate PostgreSQL
# containers so their data and schemas remain isolated.
#
# Start:     docker compose -f infra/docker/docker-compose.yml up -d
# UI:        http://localhost:5000
# MinIO UI:  http://localhost:9001  (minioadmin / minioadmin)
#
# With the stack running, train.py writes metadata to PostgreSQL and artifacts
# to MinIO through the MLflow artifact proxy. Clients do not need S3 credentials.

services:
  mongo:
    # MongoDB stores immutable reviews consumed by Review Producer.
    # The host port supports Python services currently running on Windows.
    image: mongo:8.0.29
    hostname: mongo
    ports:
      - "27017:27017"
    environment:
      # Development-only credentials. Production secrets must come from a
      # dedicated secret store.
      MONGO_INITDB_ROOT_USERNAME: kinopoisk
      MONGO_INITDB_ROOT_PASSWORD: kinopoisk
      MONGO_INITDB_DATABASE: kinopoisk
    volumes:
      - mongodata:/data/db
    healthcheck:
      # Verify that the database responds, not only that its process is alive.
      test: ["CMD", "mongosh", "--quiet", "--username", "kinopoisk", "--password", "kinopoisk", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka:
    # Official Apache Kafka image running one broker/controller in KRaft mode.
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Containers use INTERNAL at kafka:19092. Windows host processes use HOST
      # at localhost:9092.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      # Internal Kafka topics use replication factor 1 in this single-node stack.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka-init:
    # One-shot container that idempotently creates the contract topics.
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic kinopoisk.reviews.v1 --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic kinopoisk.predictions.v1 --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic kinopoisk.reviews.dlq.v1 --partitions 1 --replication-factor 1 &&
      echo 'Kafka topics are ready';
      "

  postgres:
    # Dedicated MLflow metadata database.
    image: postgres:16
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  predictions-postgres:
    # Dedicated application database for prediction history. Host port 5433
    # avoids conflict with the MLflow PostgreSQL service.
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      # Development-only credentials. Use secret storage in production.
      POSTGRES_USER: kinopoisk
      POSTGRES_PASSWORD: kinopoisk
      POSTGRES_DB: kinopoisk_predictions
    volumes:
      # A named volume preserves history across stop/down operations.
      - predictions_pgdata:/var/lib/postgresql/data
      # The official image runs this migration when initializing an empty database.
      - ../../contracts/postgresql/001_create_prediction_history.sql:/docker-entrypoint-initdb.d/001_create_prediction_history.sql:ro
    healthcheck:
      # Verify that the target application database accepts connections.
      test: ["CMD-SHELL", "pg_isready -U kinopoisk -d kinopoisk_predictions"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot container that creates the artifact bucket.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/mlflow-artifacts &&
      echo 'bucket mlflow-artifacts ready';
      "

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # The MLflow server uses these credentials to write to MinIO.
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
      --artifacts-destination s3://mlflow-artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"

volumes:
  mongodata:
  pgdata:
  predictions_pgdata:
  miniodata:
